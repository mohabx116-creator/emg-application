name: EMG CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emg-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_DB: emg_qa_stg01c
          POSTGRES_USER: emg_ci
          POSTGRES_PASSWORD: emg_ci_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U emg_ci -d emg_qa_stg01c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: BackEnd
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EMG.slnx

      - name: Release build
        run: dotnet build EMG.slnx --no-restore --configuration Release

      - name: Safe regression tests
        run: >-
          dotnet test EMG.slnx --no-restore --no-build --configuration Release
          --logger "trx;LogFileName=safe-regression.trx"
          --filter "FullyQualifiedName!~PostgresTests&FullyQualifiedName!~UniversalImportCoverageCrosswalkTests&FullyQualifiedName!~UniversalImportPreviewTests&FullyQualifiedName!~WorkflowAtomicTransitionTests"

      - name: PostgreSQL integration tests
        env:
          ConnectionStrings__EmgDb: Host=127.0.0.1;Port=55432;Database=emg_qa_stg01c;Username=emg_ci;Password=emg_ci_password
          EMG_WORKFLOW_QA_CONNECTION: Host=127.0.0.1;Port=55432;Database=emg_qa_stg01c;Username=emg_ci;Password=emg_ci_password
          EMG_HISTORICAL_QA_CONNECTION: Host=127.0.0.1;Port=55432;Database=emg_qa_stg01c;Username=emg_ci;Password=emg_ci_password
        run: >-
          dotnet test EMG.slnx --no-restore --no-build --configuration Release
          --logger "trx;LogFileName=postgres-integration.trx"
          --filter "FullyQualifiedName~PostgresTests|FullyQualifiedName~WorkflowAtomicTransitionTests"

      - name: Publish test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-results
          path: BackEnd/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 3

  frontend:
    name: Frontend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Toolchain versions
        run: node --version && npm --version

      - name: Reproducible install
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: Same-origin API contract
        run: npm run test:production-api-origin

      - name: Production route and bundle exclusions
        shell: bash
        run: |
          if grep -R -E -i 'localhost:8080|react-quill|/forms/map|"/blog|"/mail|"/editor' dist; then
            echo 'Excluded production route or API marker found in the bundle.'
            exit 1
          fi

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
