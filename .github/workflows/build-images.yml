name: Build and publish private images

on:
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/mohabx116-creator/emg-application

    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs"
          backend="$(gh api "$api" --jq '[.check_runs[] | select(.name == "Backend build and tests" and .conclusion == "success")] | length')"
          frontend="$(gh api "$api" --jq '[.check_runs[] | select(.name == "Frontend validation" and .conclusion == "success")] | length')"
          test "$backend" -ge 1
          test "$frontend" -ge 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image tag
        id: image
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Reject existing immutable tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          for image in backend frontend; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/mohabx116-creator/emg-application/${image}/manifests/${tag}")"
            if [ "$status" != 404 ]; then
              echo "Expected an absent tag for ${image}, received HTTP ${status}."
              exit 1
            fi
          done

      - name: Build and publish Backend image
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./BackEnd
          file: ./BackEnd/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}

      - name: Build and publish Frontend image
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./FrontEnd
          file: ./FrontEnd/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}

      - name: Record published digests
        shell: bash
        run: |
          {
            echo '### GHCR image digests'
            echo "- Source commit: `${GITHUB_SHA}`"
            echo "- Backend: `${{ steps.backend.outputs.digest }}`"
            echo "- Frontend: `${{ steps.frontend.outputs.digest }}`"
          } >> "$GITHUB_STEP_SUMMARY"
